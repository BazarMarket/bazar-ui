<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar — Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: #ff9138;
            opacity: 0.06;
            z-index: 0;
        }
        .bg-circle-1 { width: 600px; height: 600px; top: -200px; right: -150px; }
        .bg-circle-2 { width: 400px; height: 400px; bottom: -100px; left: -100px; }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px;
            max-width: 560px;
            width: 100%;
        }

        .logo {
            margin-bottom: 40px;
        }
        .logo img {
            height: 80px;
            width: auto;
        }

        .badge {
            display: inline-block;
            background: #fff4ea;
            color: #ff9138;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 100px;
            margin-bottom: 28px;
            border: 1px solid #ffe0c2;
        }

        h1 {
            font-size: 56px;
            font-weight: 800;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        h1 span {
            color: #ff9138;
        }

        p {
            font-size: 18px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 48px;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: #ff9138;
            border-radius: 2px;
            margin: 0 auto 40px;
        }

        .notify-form {
            display: flex;
            gap: 10px;
            max-width: 420px;
            margin: 0 auto 48px;
        }
        .notify-form input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            color: #333;
        }
        .notify-form input:focus {
            border-color: #ff9138;
        }
        .notify-form input::placeholder {
            color: #bbb;
        }
        .notify-form button {
            padding: 14px 24px;
            background: #ff9138;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .notify-form button:hover {
            background: #e07d2a;
        }

        .thanks {
            display: none;
            color: #3ecb60;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 48px;
        }

    </style>
</head>
<body>
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>

    <div class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Bazar">
        </div>

        <div class="badge">Coming Soon</div>

        <h1>Something <span>great</span><br>is coming</h1>

        <div class="divider"></div>

        <p>We're building a marketplace for classified ads<br>in the United Kingdom.</p>

        <div class="notify-form" id="form">
            <input type="email" placeholder="Your email address" id="emailInput">
            <button onclick="subscribe()">Notify me</button>
        </div>
        <div class="thanks" id="thanks">✓ Thanks! We'll let you know when we launch.</div>

    </div>

    <script>
        async function subscribe() {
            var email = document.getElementById('emailInput').value;
            var btn = document.querySelector('.notify-form button');
            if (!email || !email.includes('@')) {
                document.getElementById('emailInput').style.borderColor = '#e82222';
                return;
            }
            btn.textContent = '...';
            btn.disabled = true;
            try {
                var res = await fetch('https://formspree.io/f/maqpbdjl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                if (res.ok) {
                    document.getElementById('form').style.display = 'none';
                    document.getElementById('thanks').style.display = 'block';
                } else {
                    btn.textContent = 'Notify me';
                    btn.disabled = false;
                    alert('Something went wrong. Please try again.');
                }
            } catch(e) {
                btn.textContent = 'Notify me';
                btn.disabled = false;
                alert('Something went wrong. Please try again.');
            }
        }
    </script>
</body>
</html>
